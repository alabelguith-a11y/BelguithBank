<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Comptes — BankApp</title>
    <!-- Bootstrap 5 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"/>
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold" href="/"><i class="bi bi-bank2 me-2"></i>BankApp</a>
    <div class="navbar-nav ms-auto">
        <a class="nav-link" th:href="@{/clients}"><i class="bi bi-people-fill me-1"></i>Clients</a>
        <a class="nav-link active" th:href="@{/comptes}"><i class="bi bi-credit-card me-1"></i>Comptes</a>
    </div>
</nav>

<div class="container py-5">
    <h2 class="mb-4 fw-bold"><i class="bi bi-credit-card me-2 text-primary"></i>Gestion des Comptes</h2>

    <!-- Add / Edit Form -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-white fw-semibold"
             th:text="${editing} != null ? '✏️ Modifier le compte' : '➕ Ajouter un compte'">
            Ajouter un compte
        </div>
        <div class="card-body">
            <form th:action="${editing} != null ? @{/comptes/update} : @{/comptes/save}" method="post">

                <!-- Hidden RIB for update -->
                <input type="hidden" th:if="${editing != null}" name="rib" th:value="${editing.rib()}"/>

                <div class="row g-3 align-items-end">
                    <div class="col-md-4">
                        <label for="solde" class="form-label fw-semibold">Solde (TND)</label>
                        <div class="input-group">
                            <span class="input-group-text">TND</span>
                            <input type="number" id="solde" name="solde" class="form-control"
                                   th:value="${editing != null ? editing.solde() : ''}"
                                   step="0.01" min="0"
                                   placeholder="0.00" required/>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <label for="clientCin" class="form-label fw-semibold">Client</label>
                        <select id="clientCin" name="clientCin" class="form-select" required>
                            <option value="">-- Sélectionner un client --</option>
                            <option th:each="cl : ${clients}"
                                    th:value="${cl.cin}"
                                    th:selected="${editing != null and editing.clientCin() == cl.cin}"
                                    th:text="${cl.nom} + ' ' + ${cl.prenom} + ' (' + ${cl.cin} + ')'">
                            </option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <button type="submit" class="btn w-100"
                                th:classappend="${editing} != null ? 'btn-success' : 'btn-primary'"
                                th:text="${editing} != null ? '✔ Mettre à jour' : '+ Ajouter'">
                            + Ajouter
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Table -->
    <div class="card shadow-sm">
        <div class="card-header bg-white fw-semibold">
            <i class="bi bi-table me-1"></i> Liste des comptes
        </div>
        <div class="card-body p-0">
            <div th:if="${comptes.empty}" class="text-center text-muted py-5">
                <i class="bi bi-inbox fs-2 d-block mb-2"></i>Aucun compte enregistré.
            </div>
            <div th:unless="${comptes.empty}" class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th>RIB</th>
                        <th>Solde (TND)</th>
                        <th>CIN Client</th>
                        <th>Nom complet</th>
                        <th class="text-center">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="c : ${comptes}" th:id="${c.rib}">
                        <td><span class="badge bg-secondary" th:text="${c.rib}"></span></td>
                        <td>
                            <span class="fw-semibold text-success"
                                  th:text="${#numbers.formatDecimal(c.solde, 1, 3)}"></span>
                        </td>
                        <td>
                            <span class="badge bg-primary" th:text="${c.client.cin}"></span>
                        </td>
                        <td th:text="${c.client.nom} + ' ' + ${c.client.prenom}"></td>
                        <td class="text-center">
                            <a th:href="@{/comptes/edit/{rib}(rib=${c.rib})}"
                               class="btn btn-sm btn-outline-primary me-1">
                                <i class="bi bi-pencil-fill"></i> Modifier
                            </a>
                            <button type="button" class="btn btn-sm btn-outline-danger btn-delete-compte"
                                    th:data-rib="${c.rib}">
                                <i class="bi bi-trash-fill"></i> Supprimer
                            </button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    $(document).on("click", ".btn-delete-compte", function () {
        const rib = $(this).data("rib");

        Swal.fire({
            title: "Confirmer la suppression",
            text: "Voulez-vous vraiment supprimer ce compte ?",
            icon: "warning",
            showCancelButton: true,
            confirmButtonColor: "#d33",
            cancelButtonColor: "#6c757d",
            confirmButtonText: "Oui, supprimer",
            cancelButtonText: "Annuler"
        }).then((result) => {
            if (result.isConfirmed) {
                $.ajax({
                    url: "/comptes/delete",
                    type: "POST",
                    data: { rib: rib },
                    success: function () {
                        $("#" + rib).remove();
                        Swal.fire({
                            title: "Supprimé !",
                            text: "Le compte a été supprimé avec succès.",
                            icon: "success",
                            timer: 1800,
                            showConfirmButton: false
                        });
                    },
                    error: function () {
                        Swal.fire("Erreur", "Une erreur serveur s'est produite.", "error");
                    }
                });
            }
        });
    });
</script>

</body>
</html>
