<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>BankApp — ENIS</title>
    <!-- Bootstrap 5 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <style>
        body { background: #f8f9fa; }
        .hero {
            min-height: calc(100vh - 60px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold" href="/"><i class="bi bi-bank2 me-2"></i>BankApp</a>
    <div class="navbar-nav ms-auto">
        <a class="nav-link" th:href="@{/clients}"><i class="bi bi-people-fill me-1"></i>Clients</a>
        <a class="nav-link" th:href="@{/comptes}"><i class="bi bi-credit-card me-1"></i>Comptes</a>
    </div>
</nav>

<div class="hero text-center px-3">
    <i class="bi bi-bank2 display-1 text-primary mb-3"></i>
    <h1 class="display-4 fw-bold mb-2">Bienvenue sur <span class="text-primary">BelguithBank</span></h1>
    <p class="text-muted fs-5 mb-4">Système de gestion bancaire</p>
    <div class="d-flex gap-3 flex-wrap justify-content-center">
        <a th:href="@{/clients}" class="btn btn-primary btn-lg px-4">
            <i class="bi bi-people-fill me-2"></i>Gérer les Clients
        </a>
        <a th:href="@{/comptes}" class="btn btn-outline-primary btn-lg px-4">
            <i class="bi bi-credit-card me-2"></i>Gérer les Comptes
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
